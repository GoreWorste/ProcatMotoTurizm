# Пример для Ubuntu/Debian: /etc/nginx/sites-available/motoprocatflutter
# Домен: motoprocatflutter.romanovivv.ru → статика Flutter из /var/www/motoprocatflutter

server {
    listen 80;
    server_name motoprocatflutter.romanovivv.ru;

    root /var/www/motoprocatflutter;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Опционально: mock API на том же сервере (node api/mock-server.js --port 8080)
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
